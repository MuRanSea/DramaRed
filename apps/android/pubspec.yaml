name: dramared
description: DramaRed — personal learning short-drama client (Android).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Locked to openhongguo 0.2.0 API; path pins a Gradle-patched vendored copy
  # (upstream pub android/build.gradle.kts misses kotlin android plugin).
  openhongguo:
    path: packages/openhongguo
  # Player stack; ClearKey / background audio reserved for later
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
