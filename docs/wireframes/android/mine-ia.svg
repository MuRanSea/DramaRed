<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="820" viewBox="0 0 620 820">
<style>
.bg{fill:#0f0f10}.panel{fill:#1a1a1c;stroke:#2a2a2e;stroke-width:1.5;rx:12}
.soft{fill:#242428;stroke:#333;stroke-width:1;rx:8}
.line{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:4 3}
.accent{fill:#ff4d4f}.fg{fill:#eee;font-family:system-ui,sans-serif}.muted{fill:#999;font-family:system-ui,sans-serif}
.anno{fill:#ffb020;font-family:system-ui,sans-serif;font-size:11px}.title{font-size:14px;font-weight:700}.small{font-size:11px}
.chip{fill:#2a2a2e;stroke:#444;rx:6}
</style>
<rect width="620" height="820" fill="#0a0a0b"/>
<!-- phone -->
<rect x="20" y="20" width="390" height="780" rx="28" class="bg" stroke="#333" stroke-width="2"/>
<rect x="150" y="28" width="120" height="10" rx="5" fill="#222"/>

  <text x="215" y="70" text-anchor="middle" class="fg title">我的</text>
  <rect x="40" y="100" width="350" height="220" class="panel"/>
  <text x="55" y="130" class="fg small">历史续播</text>
  <rect x="55" y="145" width="60" height="80" class="soft"/>
  <rect x="125" y="150" width="180" height="10" class="chip"/>
  <rect x="125" y="168" width="120" height="8" class="chip"/>
  <rect x="55" y="235" width="60" height="70" class="soft"/>
  <rect x="125" y="245" width="160" height="10" class="chip"/>
  <rect x="40" y="340" width="350" height="70" class="panel"/>
  <text x="55" y="380" class="fg small">★ 收藏</text>
  <text x="350" y="380" class="muted small">›</text>
  <rect x="40" y="430" width="350" height="70" class="panel"/>
  <text x="55" y="470" class="fg small">⚙ 设置</text>
  <text x="350" y="470" class="muted small">›</text>
  <rect x="20" y="720" width="390" height="60" fill="#121214" stroke="#222"/>
<circle cx="85" cy="740" r="8" fill="none" stroke="#888" stroke-width="2"/>
<text x="85" y="765" text-anchor="middle" class="muted small" fill="#888">首页</text>
<circle cx="195" cy="740" r="8" fill="none" stroke="#888" stroke-width="2"/>
<text x="195" y="765" text-anchor="middle" class="muted small" fill="#888">剧场</text>
<circle cx="305" cy="740" r="8" fill="none" stroke="#ff4d4f" stroke-width="2"/>
<text x="305" y="765" text-anchor="middle" class="muted small" fill="#ff4d4f">我的</text>

<!-- annotations -->

  <text x="430" y="180" class="anno">① 点历史项 → 续播</text>
  <text x="430" y="380" class="anno">② 收藏列表入口</text>
  <text x="430" y="470" class="anno">③ 设置入口（含定时停）</text>
  <text x="430" y="510" class="anno">④ 无下载 / 无多余 Tab</text>

</svg>
