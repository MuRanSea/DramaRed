<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760">
<style>
.bg{fill:#0f0f10}.phone{fill:#111114;stroke:#3a3a40;stroke-width:2}
.bar{fill:#16161a}.panel{fill:#1c1c22;stroke:#2e2e36;stroke-width:1.2}
.soft{fill:#24242c;stroke:#353540;stroke-width:1}
.chip{fill:#2a2a32;stroke:#3d3d48}
.accent{fill:#ff4d4f}.ok{fill:#3dd68c}.warn{fill:#ffb020}
.fg{fill:#eee;font-family:ui-sans-serif,system-ui,sans-serif}.mu{fill:#9a9aa3;font-family:ui-sans-serif,system-ui,sans-serif}
.anno{fill:#ffb020;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px}
.spec{fill:#7db7ff;font-family:ui-monospace,monospace;font-size:10px}
.h{font-size:14px;font-weight:700}.s{font-size:11px}.xs{font-size:10px}
.dash{fill:none;stroke:#ffb020;stroke-width:1;stroke-dasharray:3 2}
.dim{fill:#eee;opacity:.35}
</style>
<rect width="720" height="760" fill="#08080a"/>

<rect x="16" y="16" width="360" height="720" rx="26" class="phone"/><rect x="126" y="24" width="140" height="8" rx="4" fill="#222"/>
<text x="36" y="36" class="mu xs">9:41</text><text x="340" y="36" text-anchor="end" class="mu xs">5G 100%</text>
<text x="36" y="78" class="fg h">推荐</text>
<rect x="320" y="56" width="40" height="40" rx="10" class="soft"/>
<rect x="48" y="260" width="272" height="200" rx="14" class="panel"/>
<text x="184" y="320" text-anchor="middle" class="fg s">暂时没有推荐</text>
<text x="184" y="348" text-anchor="middle" class="mu xs">可以下拉刷新，或去剧场找剧</text>
<rect x="110" y="380" width="148" height="40" rx="20" class="accent"/>
<text x="184" y="405" text-anchor="middle" class="s" fill="#111">去剧场逛逛</text>
<rect x="16" y="676" width="360" height="60" class="bar"/>
<circle cx="76" cy="694" r="7" fill="none" stroke="#ff4d4f" stroke-width="2"/>
<text x="76" y="718" text-anchor="middle" class="s" fill="#ff4d4f">首页</text>
<circle cx="196" cy="694" r="7" fill="none" stroke="#888" stroke-width="2"/>
<text x="196" y="718" text-anchor="middle" class="s" fill="#888">剧场</text>
<circle cx="316" cy="694" r="7" fill="none" stroke="#888" stroke-width="2"/>
<text x="316" y="718" text-anchor="middle" class="s" fill="#888">我的</text>
<text x="400" y="280" class="anno">状态：Empty（真无内容）</text>
<text x="400" y="348" class="anno">说明「为什么空」+ 一个主操作</text>
