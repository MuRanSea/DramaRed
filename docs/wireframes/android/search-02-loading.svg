<circle cx="196" cy="694" r="7" fill="none" stroke="#888" stroke-width="2"/>
<text x="196" y="718" text-anchor="middle" class="s" fill="#888">剧场</text>
<circle cx="316" cy="694" r="7" fill="none" stroke="#888" stroke-width="2"/>
