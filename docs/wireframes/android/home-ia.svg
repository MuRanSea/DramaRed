<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="820" viewBox="0 0 620 820">
<style>
.bg{fill:#0f0f10}.panel{fill:#1a1a1c;stroke:#2a2a2e;stroke-width:1.5;rx:12}
.soft{fill:#242428;stroke:#333;stroke-width:1;rx:8}
.line{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:4 3}
.accent{fill:#ff4d4f}.fg{fill:#eee;font-family:system-ui,sans-serif}.muted{fill:#999;font-family:system-ui,sans-serif}
.anno{fill:#ffb020;font-family:system-ui,sans-serif;font-size:11px}.title{font-size:14px;font-weight:700}.small{font-size:11px}
.chip{fill:#2a2a2e;stroke:#444;rx:6}
</style>
<rect width="620" height="820" fill="#0a0a0b"/>
<!-- phone -->
<rect x="20" y="20" width="390" height="780" rx="28" class="bg" stroke="#333" stroke-width="2"/>
<rect x="150" y="28" width="120" height="10" rx="5" fill="#222"/>

  <text x="40" y="70" class="fg title">推荐</text>
  <circle cx="370" cy="62" r="12" fill="none" stroke="#ccc" stroke-width="2"/>
  <line x1="364" y1="68" x2="378" y2="78" stroke="#ccc" stroke-width="2"/>
  <rect x="40" y="90" width="350" height="560" class="soft"/>
  <text x="215" y="360" text-anchor="middle" class="muted">竖海报占位 · 点进播放</text>
  <rect x="50" y="590" width="200" height="14" class="chip"/>
  <rect x="50" y="612" width="140" height="10" class="chip"/>
  <text x="360" y="380" class="fg" font-size="18">↕</text>
  <rect x="20" y="720" width="390" height="60" fill="#121214" stroke="#222"/>
<circle cx="85" cy="740" r="8" fill="none" stroke="#ff4d4f" stroke-width="2"/>
<text x="85" y="765" text-anchor="middle" class="muted small" fill="#ff4d4f">首页</text>
<circle cx="195" cy="740" r="8" fill="none" stroke="#888" stroke-width="2"/>
<text x="195" y="765" text-anchor="middle" class="muted small" fill="#888">剧场</text>
<circle cx="305" cy="740" r="8" fill="none" stroke="#888" stroke-width="2"/>
<text x="305" y="765" text-anchor="middle" class="muted small" fill="#888">我的</text>

<!-- annotations -->

  <text x="430" y="70" class="anno">① 顶栏仅「推荐」+ 搜索入口</text>
  <path d="M420 62 L380 62" class="line"/>
  <text x="430" y="360" class="anno">② 竖滑换剧（非整页播）</text>
  <text x="430" y="380" class="anno">③ 点封面 → 播放页再切集</text>
  <text x="430" y="750" class="anno">④ 底栏：首页 / 剧场 / 我的</text>

</svg>
