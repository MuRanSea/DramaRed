<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="820" viewBox="0 0 620 820">
<style>
.bg{fill:#0f0f10}.panel{fill:#1a1a1c;stroke:#2a2a2e;stroke-width:1.5;rx:12}
.soft{fill:#242428;stroke:#333;stroke-width:1;rx:8}
.line{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:4 3}
.accent{fill:#ff4d4f}.fg{fill:#eee;font-family:system-ui,sans-serif}.muted{fill:#999;font-family:system-ui,sans-serif}
.anno{fill:#ffb020;font-family:system-ui,sans-serif;font-size:11px}.title{font-size:14px;font-weight:700}.small{font-size:11px}
.chip{fill:#2a2a2e;stroke:#444;rx:6}
</style>
<rect width="620" height="820" fill="#0a0a0b"/>
<!-- phone -->
<rect x="20" y="20" width="390" height="780" rx="28" class="bg" stroke="#333" stroke-width="2"/>
<rect x="150" y="28" width="120" height="10" rx="5" fill="#222"/>

  <text x="40" y="70" class="fg">‹</text>
  <text x="215" y="70" text-anchor="middle" class="fg title">设置</text>
  <rect x="40" y="100" width="350" height="140" class="panel"/>
  <text x="55" y="130" class="fg small">定时停播</text>
  <text x="55" y="155" class="muted small">关 / 15 / 30 / 60 分钟</text>
  <rect x="55" y="175" width="50" height="28" class="chip"/><text x="70" y="193" class="muted small">关</text>
  <rect x="115" y="175" width="60" height="28" class="chip"/><text x="125" y="193" class="muted small">15分</text>
  <rect x="185" y="175" width="60" height="28" class="chip"/><text x="195" y="193" class="muted small">30分</text>
  <rect x="255" y="175" width="60" height="28" class="chip"/><text x="265" y="193" class="muted small">60分</text>
  <rect x="40" y="260" width="350" height="60" class="panel"/>
  <text x="55" y="295" class="fg small">后台继续听</text>
  <rect x="330" y="280" width="40" height="22" rx="11" fill="#ff4d4f"/>
  <rect x="40" y="340" width="350" height="60" class="panel"/>
  <text x="55" y="375" class="fg small">自动连播</text>
  <rect x="330" y="360" width="40" height="22" rx="11" fill="#ff4d4f"/>
  <text x="40" y="440" class="muted small">不做下载 · 从「我的」进入</text>

<!-- annotations -->

  <text x="430" y="130" class="anno">① 定时停播放这里</text>
  <text x="430" y="295" class="anno">② 后台听开关</text>
  <text x="430" y="375" class="anno">③ 自动连播</text>

</svg>
