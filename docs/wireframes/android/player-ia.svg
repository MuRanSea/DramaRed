<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="820" viewBox="0 0 620 820">
<style>
.bg{fill:#0f0f10}.panel{fill:#1a1a1c;stroke:#2a2a2e;stroke-width:1.5;rx:12}
.soft{fill:#242428;stroke:#333;stroke-width:1;rx:8}
.line{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:4 3}
.accent{fill:#ff4d4f}.fg{fill:#eee;font-family:system-ui,sans-serif}.muted{fill:#999;font-family:system-ui,sans-serif}
.anno{fill:#ffb020;font-family:system-ui,sans-serif;font-size:11px}.title{font-size:14px;font-weight:700}.small{font-size:11px}
.chip{fill:#2a2a2e;stroke:#444;rx:6}
</style>
<rect width="620" height="820" fill="#0a0a0b"/>
<!-- phone -->
<rect x="20" y="20" width="390" height="780" rx="28" class="bg" stroke="#333" stroke-width="2"/>
<rect x="150" y="28" width="120" height="10" rx="5" fill="#222"/>

  <rect x="20" y="20" width="390" height="780" rx="28" fill="#050505" stroke="#333" stroke-width="2"/>
  <text x="40" y="60" class="fg">‹</text>
  <rect x="40" y="90" width="350" height="480" class="soft"/>
  <polygon points="195,300 195,360 245,330" class="accent"/>
  <text x="215" y="600" text-anchor="middle" class="fg small">剧名 · 第 3 集</text>
  <rect x="40" y="620" width="350" height="4" fill="#333"/>
  <rect x="40" y="620" width="140" height="4" class="accent"/>
  <rect x="40" y="650" width="70" height="28" class="chip"/><text x="52" y="668" class="muted small">清晰度</text>
  <rect x="120" y="650" width="70" height="28" class="chip"/><text x="138" y="668" class="muted small">倍速</text>
  <rect x="200" y="650" width="70" height="28" class="chip"/><text x="218" y="668" class="muted small">选集</text>
  <rect x="280" y="650" width="70" height="28" class="chip"/><text x="298" y="668" class="muted small">收藏</text>
  <text x="215" y="720" text-anchor="middle" class="muted small">上滑下一集 · 下滑上一集 · 预加载</text>

<!-- annotations -->

  <text x="430" y="120" class="anno">① 竖屏全屏沉浸</text>
  <text x="430" y="330" class="anno">② 上下滑切集 + 预加载</text>
  <text x="430" y="660" class="anno">③ 清晰度/倍速/选集/收藏</text>
  <text x="430" y="690" class="anno">④ 定时停 → 设置页</text>
  <text x="430" y="720" class="anno">⑤ 切后台可听</text>

</svg>
