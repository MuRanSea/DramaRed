<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="820" viewBox="0 0 620 820">
<style>
.bg{fill:#0f0f10}.panel{fill:#1a1a1c;stroke:#2a2a2e;stroke-width:1.5;rx:12}
.soft{fill:#242428;stroke:#333;stroke-width:1;rx:8}
.line{fill:none;stroke:#666;stroke-width:1.2;stroke-dasharray:4 3}
.accent{fill:#ff4d4f}.fg{fill:#eee;font-family:system-ui,sans-serif}.muted{fill:#999;font-family:system-ui,sans-serif}
.anno{fill:#ffb020;font-family:system-ui,sans-serif;font-size:11px}.title{font-size:14px;font-weight:700}.small{font-size:11px}
.chip{fill:#2a2a2e;stroke:#444;rx:6}
</style>
<rect width="620" height="820" fill="#0a0a0b"/>
<!-- phone -->
<rect x="20" y="20" width="390" height="780" rx="28" class="bg" stroke="#333" stroke-width="2"/>
<rect x="150" y="28" width="120" height="10" rx="5" fill="#222"/>

  <text x="215" y="70" text-anchor="middle" class="fg title">剧场</text>
  <rect x="40" y="90" width="105" height="160" class="soft"/><rect x="40" y="255" width="80" height="8" class="chip"/><rect x="155" y="90" width="105" height="160" class="soft"/><rect x="155" y="255" width="80" height="8" class="chip"/><rect x="270" y="90" width="105" height="160" class="soft"/><rect x="270" y="255" width="80" height="8" class="chip"/><rect x="40" y="280" width="105" height="160" class="soft"/><rect x="40" y="445" width="80" height="8" class="chip"/><rect x="155" y="280" width="105" height="160" class="soft"/><rect x="155" y="445" width="80" height="8" class="chip"/><rect x="270" y="280" width="105" height="160" class="soft"/><rect x="270" y="445" width="80" height="8" class="chip"/><rect x="40" y="470" width="105" height="160" class="soft"/><rect x="40" y="635" width="80" height="8" class="chip"/><rect x="155" y="470" width="105" height="160" class="soft"/><rect x="155" y="635" width="80" height="8" class="chip"/><rect x="270" y="470" width="105" height="160" class="soft"/><rect x="270" y="635" width="80" height="8" class="chip"/>
  <rect x="20" y="720" width="390" height="60" fill="#121214" stroke="#222"/>
<circle cx="85" cy="740" r="8" fill="none" stroke="#888" stroke-width="2"/>
<text x="85" y="765" text-anchor="middle" class="muted small" fill="#888">首页</text>
<circle cx="195" cy="740" r="8" fill="none" stroke="#ff4d4f" stroke-width="2"/>
<text x="195" y="765" text-anchor="middle" class="muted small" fill="#ff4d4f">剧场</text>
<circle cx="305" cy="740" r="8" fill="none" stroke="#888" stroke-width="2"/>
<text x="305" y="765" text-anchor="middle" class="muted small" fill="#888">我的</text>

