<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780">
<style>
.bg{fill:#0f0f10}.phone{fill:#111114;stroke:#3a3a40;stroke-width:2}
.bar{fill:#16161a}.panel{fill:#1c1c22;stroke:#2e2e36;stroke-width:1.2}
.soft{fill:#24242c;stroke:#353540;stroke-width:1}
.chip{fill:#2a2a32;stroke:#3d3d48}
.accent{fill:#ff4d4f}.ok{fill:#3dd68c}.warn{fill:#ffb020}
.fg{fill:#eee;font-family:ui-sans-serif,system-ui,sans-serif}.mu{fill:#9a9aa3;font-family:ui-sans-serif,system-ui,sans-serif}
.anno{fill:#ffb020;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px}
.spec{fill:#7db7ff;font-family:ui-monospace,monospace;font-size:10px}
.h{font-size:14px;font-weight:700}.s{font-size:11px}.xs{font-size:10px}
.dash{fill:none;stroke:#ffb020;stroke-width:1;stroke-dasharray:3 2}
</style>
<rect width="720" height="780" fill="#08080a"/>

