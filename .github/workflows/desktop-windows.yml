name: Desktop Windows package

on:
  push:
    branches: [main, feat/desktop-windows-shell-ui]
    tags: ["desktop-v*", "v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "scripts/package-windows.sh"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

jobs:
  windows-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: apps/desktop/daemon/go.sum
      - name: Package Windows x64 zip
        run: ./scripts/package-windows.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DramaRed-desktop-win-x64
          path: dist/DramaRed-desktop-win-x64.zip
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DramaRed-desktop-win-x64.zip
          generate_release_notes: true
